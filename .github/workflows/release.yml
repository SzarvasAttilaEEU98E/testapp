name: Build and Deploy Book API

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: szarvasattilaeeu98e/book-api

  GITOPS_REPOSITORY: mattycska/gitops
  GITOPS_BRANCH: main
  GITOPS_FILE: book-api-attila/deployment.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Book repository letöltése
      - name: Checkout Book API repository
        uses: actions/checkout@v4

      # 2. Bejelentkezés a GitHub Container Registry-be
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 3. Docker image build + push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      # 4. GitOps repository letöltése
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      # 5. Új feature branch létrehozása
      - name: Create GitOps feature branch
        working-directory: gitops
        shell: bash
        run: |
          BRANCH="update-book-api-${GITHUB_REF_NAME}"

          git checkout -b "$BRANCH"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # 6. Image verzió átírása
      - name: Update Book API image version
        working-directory: gitops
        shell: bash
        run: |
          sed -i \
            "s|image: ghcr.io/szarvasattilaeeu98e/book-api:.*|image: ghcr.io/szarvasattilaeeu98e/book-api:${GITHUB_REF_NAME}|" \
            "${GITOPS_FILE}"

          echo "Updated image:"
          grep "ghcr.io/szarvasattilaeeu98e/book-api" "${GITOPS_FILE}"

      # 7. Módosítás commitolása
      - name: Commit GitOps change
        working-directory: gitops
        shell: bash
        run: |
          git config user.name "book-api-deploy-bot"
          git config user.email "book-api-deploy-bot@users.noreply.github.com"

          git add "${GITOPS_FILE}"

          git commit -m "Deploy Book API ${GITHUB_REF_NAME}"

      # 8. Feature branch feltöltése
      - name: Push GitOps feature branch
        working-directory: gitops
        shell: bash
        run: |
          git push origin "$BRANCH"

      # 9. Pull Request automatikus létrehozása
      - name: Create Pull Request
        working-directory: gitops
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          gh pr create \
            --repo "${GITOPS_REPOSITORY}" \
            --base "${GITOPS_BRANCH}" \
            --head "${BRANCH}" \
            --title "Deploy Book API ${GITHUB_REF_NAME}" \
            --body "Updates the Book API image to ${GITHUB_REF_NAME}."